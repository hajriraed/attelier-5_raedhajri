<!DOCTYPE html>
<html>
<head>
    <title>Exercice 1</title>
</head>
<body>

<script>
    var a = Number(prompt("Donner a"));
    var b = Number(prompt("Donner b"));
    var c = Number(prompt("Donner c"));
    var delta = b*b - 4*a*c;
    if (delta == 0) {
        var x = -b / (2*a);
        document.write("X = " + x);
    }
    else if (delta > 0) {
        var x1 = (-b + Math.sqrt(delta)) / (2*a);
        var x2 = (-b - Math.sqrt(delta)) / (2*a);

        document.write("X1 = " + x1 + "<br>");
        document.write("X2 = " + x2);
    }
    else {
        document.write("Aucune solution");
    }
</script>

</body>
</html>
